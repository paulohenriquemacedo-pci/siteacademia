    <style>
      :root {
        --ink-primary: oklch(0.22 0.025 155);
        --accent-navy: oklch(0.40 0.09 160);
        --accent-lime: oklch(0.88 0.16 120);
        --font-serif-title: 'Fraunces', Georgia, serif;
        --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --radius-md: 14px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font-sans);
        background: linear-gradient(180deg, var(--accent-navy) 0%, var(--ink-primary) 100%);
        color: #ffffff;
        display: flex;
        justify-content: center;
        padding: 48px 20px 64px;
      }

      .bio-wrap {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .bio-logo {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        margin-bottom: 20px;
      }

      .bio-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 10px;
      }

      .bio-title {
        font-family: var(--font-serif-title);
        font-weight: 600;
        font-size: 1.4rem;
        line-height: 1.3;
        margin: 0 0 6px;
      }

      .bio-sub {
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.72);
        margin: 0 0 32px;
        line-height: 1.5;
      }

      .bio-links {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .bio-link {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        width: 100%;
        padding: 18px 20px;
        border-radius: var(--radius-md);
        text-decoration: none;
        font-family: var(--font-sans);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .bio-link:active { transform: scale(0.98); }

      .bio-link--primary {
        background: var(--accent-lime);
        color: var(--ink-primary);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      }

      .bio-link--primary .bio-link-title {
        font-weight: 700;
        font-size: 1.02rem;
      }

      .bio-link--primary .bio-link-note {
        font-size: 0.78rem;
        opacity: 0.75;
      }

      .bio-link--secondary {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #ffffff;
      }

      .bio-link--secondary .bio-link-title {
        font-weight: 600;
        font-size: 0.96rem;
      }

      .bio-link--secondary .bio-link-note {
        font-size: 0.76rem;
        color: rgba(255, 255, 255, 0.6);
      }

      .bio-footer {
        margin-top: 40px;
        font-size: 0.72rem;
        color: rgba(255, 255, 255, 0.4);
      }
    </style>

  <body>
    <div class="bio-wrap">
      <div class="bio-logo">
        <img src="/bio/logo.png" alt="Sistema A.C.A.D.E.M.I.A." />
      </div>
      <h1 class="bio-title">Sistema A.C.A.D.E.M.I.A.</h1>
      <p class="bio-sub">Protocolo de produtividade acadêmica para pós-graduandos e pesquisadores.</p>

      <div class="bio-links">
        <a id="link-quiz" class="bio-link bio-link--primary" href="https://quiz.sistemaacademia.com.br/">
          <span class="bio-link-title">🎯 Fazer meu Diagnóstico Grátis</span>
          <span class="bio-link-note">2-3 minutos · descubra seu perfil produtivo</span>
        </a>
        <a id="link-site" class="bio-link bio-link--secondary" href="/">
          <span class="bio-link-title">📚 Conhecer o Sistema A.C.A.D.E.M.I.A.</span>
          <span class="bio-link-note">sistemaacademia.com.br</span>
        </a>
      </div>

      <p class="bio-footer">© Sistema A.C.A.D.E.M.I.A. — Todos os direitos reservados.</p>
    </div>

    <script>
      (function () {
        // Repassa os parametros de rastreio que chegaram nesta pagina (UTM,
        // fbclid, gclid/gbraid/wbraid) para os dois links de destino, sem
        // perder nada no meio do caminho (diferente do Linktree, que nao
        // repassa esses parametros pro link final). Se a visita chegou sem
        // nenhum parametro (ex: alguem digitou o link direto), aplica um UTM
        // padrao que marca a origem como organico da bio, evitando cair no
        // bucket "meta" do painel (ver utm_normalizer.py: "instagram"/"ig"
        // sozinhos sao classificados como Meta Ads, entao o padrao aqui usa
        // "instagram_organic" para nao colidir).
        var params = new URLSearchParams(window.location.search);
        var hasTrackingParams = [
          "utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content",
          "fbclid", "gclid", "gbraid", "wbraid"
        ].some(function (k) { return params.has(k); });

        if (!hasTrackingParams) {
          params.set("utm_source", "instagram_organic");
          params.set("utm_medium", "bio");
          params.set("utm_campaign", "link_bio");
        }

        function appendParams(url) {
          var target = new URL(url, window.location.href);
          params.forEach(function (value, key) {
            target.searchParams.set(key, value);
          });
          return target.toString();
        }

        var quizLink = document.getElementById("link-quiz");
        var siteLink = document.getElementById("link-site");
        quizLink.href = appendParams(quizLink.href);
        siteLink.href = appendParams(siteLink.href);
      })();
    </script>
  </body>
